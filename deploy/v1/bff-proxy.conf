# No retry, shared caching, request spooling or response buffering.
proxy_http_version 1.1;
proxy_set_header Host bff:3000;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Forwarded-For "";
proxy_set_header Forwarded "";
# Real Origin/Sec-Fetch-*/Cookie/CSRF/Range/multipart headers pass unchanged.
# The existing BFF strips Cookie on the API hop. Multiple Set-Cookie stays intact.
proxy_pass_request_headers on;
proxy_pass_request_body on;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_ignore_client_abort off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
add_header Cache-Control no-store always;
add_header X-Content-Type-Options nosniff always;
