# C1 source candidate. Actual nginx normalization/streaming remains NOT_RUN.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    # API/BFF own bounded upload admission; nginx must not add its default 1 MiB cap.
    client_max_body_size 0;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Reject ambiguity before normalized $uri selects a location.
    # %3A is the only encoded path character used by resource IDs.
    # Query bytes remain unchanged for the BFF exact allowlist.
    map $request_uri $bad_target {
        default 0;
        "~^[^?]*(?:%(?!3[aA])|//|\\\\|/\.{1,2}(?:/|\\?|$))" 1;
    }
    upstream bff_origin { server bff:3000; }
    server {
        listen 8080;
        root /srv;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        # Parser-level 400 can have an empty URI: named redirects would become 500.
        # Leave those native; parsed bad targets below keep the plain 404 policy.
        error_page 403 404 405 = @plain_error;
        location @plain_error { default_type text/plain; return 404 "Not found\n"; }
        if ($bad_target) { return 404; }
        # Fixed upstream and unchanged raw target; browser Host confers no trust.
        location = /config {
            proxy_pass http://bff_origin$request_uri;
            include /etc/nginx/bff-proxy.conf;
        }
        location ^~ /config/ {
            proxy_pass http://bff_origin$request_uri;
            include /etc/nginx/bff-proxy.conf;
        }
        location = /api {
            proxy_pass http://bff_origin$request_uri;
            include /etc/nginx/bff-proxy.conf;
        }
        location ^~ /api/ {
            proxy_pass http://bff_origin$request_uri;
            include /etc/nginx/bff-proxy.conf;
        }
        # Only genuinely content-hashed Vite assets receive immutable caching.
        location ~ "^/_spa/releases/[a-z0-9][a-z0-9-]{15,79}/assets/[-A-Za-z0-9_]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|ttf|otf|svg|png)$" {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ "^/_spa/releases/[a-z0-9][a-z0-9-]{15,79}/(?:spa-artifact-manifest\.json|theme-bootstrap\.js)$" {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files $uri =404;
        }
        # A literal PDF version is not a content hash. Preserve MIME/Range.
        location ^~ /pdfjs/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-cache";
        }
        location = /index.html {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /index.html =404;
        }
        location ~ "^/(?:|notebooks(?:/[-A-Za-z0-9_:%]+(?:/study)?)?|sources(?:/[-A-Za-z0-9_:%]+)?|search|podcasts|settings(?:/(?:models|api-keys))?|transformations|advanced|login)$" {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /index.html =404;
        }
        location / { default_type text/plain; return 404 "Not found\n"; }
    }
}
