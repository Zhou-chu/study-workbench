[run]
branch = True
source = .
relative_files = True
# Override data_file in a run-specific copy to keep receipts outside the checkout.
data_file = .coverage
omit =
    tests/*
    docs/*
    */node_modules/*
    */.venv/*
    */__pycache__/*
    .superpowers/*
    .git/*
    data/*
    */dist/*
    */.next/*

[report]
include_namespace_packages = True
# All first-party production Python, including entrypoints and tooling.
include =
    api/*
    open_notebook/*
    commands/*
    scripts/*
    deploy/*
    apps/*
    run_api.py
show_missing = True
precision = 2
fail_under = 90.01

[json]
pretty_print = True
